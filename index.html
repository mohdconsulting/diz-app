<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diz – prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Cairo:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17211d;
  --teal:#1c3d37;
  --teal-2:#2c5a51;
  --amber:#e5a13a;
  --paper:#f6f4ee;
  --line:#d8d3c6;
  --muted:#6b7570;
  --danger:#b3462f;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:#e9e5d8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  display:flex;
  justify-content:center;
}
h1,h2,h3,.brand,button{font-family:"Space Grotesk",sans-serif;}
body[dir="rtl"] h1,body[dir="rtl"] h2,body[dir="rtl"] h3,body[dir="rtl"] .brand,body[dir="rtl"] button,body[dir="rtl"]{
  font-family:"Cairo",sans-serif;
}
#frame{
  width:100%;
  max-width:430px;
  min-height:100%;
  background:var(--paper);
  position:relative;
  display:flex;
  flex-direction:column;
  border-left:1px solid var(--line);
  border-right:1px solid var(--line);
}
header.topbar{
  background:var(--teal);
  color:#fff;
  padding:16px 20px 14px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  position:sticky;
  top:0;
  z-index:5;
}
header.topbar .brand-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;
}
header.topbar .brand{
  font-size:14px;
  letter-spacing:0.02em;
  display:flex;
  align-items:center;
  gap:8px;
  opacity:0.85;
}
header.topbar .brand .dot{width:7px;height:7px;background:var(--amber);border-radius:50%;flex-shrink:0;}
header.topbar h1{margin:0 0 2px;font-size:21px;font-weight:600;}
.pillrow{display:flex;gap:0;border:1px solid rgba(255,255,255,0.35);flex-shrink:0;}
.pillrow button{
  background:none;border:none;color:#cfe0da;font-size:11.5px;font-weight:600;
  padding:5px 9px;cursor:pointer;font-family:"Space Grotesk",sans-serif;
}
body[dir="rtl"] .pillrow button{font-family:"Cairo",sans-serif;}
.pillrow button.on{background:var(--amber);color:var(--ink);}
.pillrow.light{border-color:var(--line);}
.pillrow.light button{color:var(--muted);}
.pillrow.light button.on{background:var(--amber);color:var(--ink);}
.user-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:11.5px;color:#cfe0da;}
.user-row button{
  background:none;border:1px solid rgba(255,255,255,0.35);color:#cfe0da;
  font-size:11px;padding:4px 9px;cursor:pointer;font-family:"Space Grotesk",sans-serif;flex-shrink:0;
}
body[dir="rtl"] .user-row button{font-family:"Cairo",sans-serif;}
main{flex:1;padding:18px 18px 90px;}
.screen{display:none;}
.screen.active{display:block;}

.card{
  background:#fff;
  border:1px solid var(--line);
  padding:14px 16px;
  margin-bottom:12px;
  position:relative;
}
.card.route::before{
  content:"";
  position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--amber);
}
body[dir="rtl"] .card.route::before{left:auto;right:0;}
.card .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.card .service-badge{font-size:11px;color:var(--teal-2);font-weight:600;margin-bottom:2px;}
.card h3{margin:0 0 4px;font-size:15px;font-weight:600;}
.card p.meta{margin:0;font-size:13px;color:var(--muted);}
.card .price{font-weight:700;font-size:16px;white-space:nowrap;}

.status{
  display:inline-block;font-size:11.5px;padding:3px 8px;margin-top:8px;
  border:1px solid currentColor;
}
.status.waiting{color:#8a6a1f;}
.status.accepted{color:var(--teal-2);}
.status.done{color:var(--muted);border-style:dashed;}
.status.pending{color:#8a6a1f;border-style:dashed;}
.status.problem{color:var(--danger);}

.empty{
  border:1px dashed var(--line);
  padding:26px 18px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

.hero{
  background:var(--teal);
  color:#fff;
  padding:22px 20px 24px;
  margin:-18px -18px 18px;
}
.hero h2{margin:0 0 8px;font-size:24px;line-height:1.15;font-weight:600;}
.hero p{margin:0 0 16px;font-size:14px;color:#cfe0da;max-width:34ch;}
.hero .stat-row{display:flex;gap:18px;margin-top:14px;font-size:12.5px;color:#a9c3ba;}
.hero .stat-row b{display:block;font-size:18px;color:#fff;font-weight:600;}

button.primary{
  background:var(--amber);
  color:var(--ink);
  border:none;
  padding:13px 18px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  width:100%;
}
button.primary:active{opacity:0.85;}
button.primary:disabled{opacity:0.5;cursor:default;}
button.secondary{
  background:transparent;
  border:1px solid var(--teal);
  color:var(--teal);
  padding:9px 12px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
}

label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 5px;}
label:first-of-type{margin-top:0;}
input[type=text],input[type=number],input[type=password],select,textarea{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  padding:10px 11px;
  font-size:14.5px;
  font-family:inherit;
  color:var(--ink);
}
textarea{resize:vertical;min-height:60px;}
input[type=file]{
  width:100%;border:1px solid var(--line);background:#fff;padding:8px;
  font-size:13px;font-family:inherit;color:var(--muted);
}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  border:1px solid var(--line);padding:7px 12px;font-size:13px;cursor:pointer;background:#fff;
  user-select:none;
}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal);}

.estimate{
  border:1px solid var(--teal);
  background:#eef3f0;
  padding:12px 14px;
  margin-top:16px;
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;
}
.estimate .num{font-size:20px;font-weight:700;white-space:nowrap;}

.offer-row{display:flex;gap:8px;margin-top:8px;align-items:center;}
.offer-row input{flex:1;width:auto;min-width:0;}
.action-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}

nav.tabbar{
  position:sticky;bottom:0;
  display:flex;
  background:#fff;
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
nav.tabbar button{
  flex:1;background:none;border:none;padding:11px 4px 9px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--muted);font-size:11px;font-weight:600;
}
nav.tabbar button.active{color:var(--teal);}
nav.tabbar svg{width:20px;height:20px;}
nav.tabbar button{position:relative;}
.tab-badge{
  position:absolute;top:4px;left:50%;margin-left:6px;
  min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--danger);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;
  display:none;
}
.tab-badge.show{display:block;}
.flag{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--danger);color:#fff;font-size:11.5px;font-weight:600;
  padding:3px 8px;margin-bottom:8px;
}
.flag svg{width:12px;height:12px;flex-shrink:0;}

.adm-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
.adm-tile{background:#fff;border:1px solid var(--line);padding:10px 12px;}
.adm-tile b{display:block;font-size:19px;font-weight:700;}
.adm-tile span{font-size:11.5px;color:var(--muted);}
.adm-tile.warn b{color:var(--danger);}
.adm-filters{margin-bottom:12px;}
.adm-row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:3px 0;border-bottom:1px dashed var(--line);}
.adm-row span{color:var(--muted);flex-shrink:0;}
.adm-row b{font-weight:600;text-align:end;word-break:break-word;}
.adm-problem{margin-top:8px;padding:8px 10px;border:1px solid var(--danger);font-size:12.5px;}
.adm-confirm{margin-top:8px;font-size:13px;color:var(--danger);}
button.danger{background:#fff;color:var(--danger);border:1px solid var(--danger);padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;}
.section-title{
  font-size:12.5px;color:var(--muted);
  margin:0 0 10px;font-weight:600;
}
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 18px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:60;
  max-width:88%;text-align:center;
}
.toast.show{opacity:1;}

#authOverlay{
  position:fixed;inset:0;background:var(--paper);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.auth-card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);padding:26px 22px;}
.auth-card h2{margin:0 0 4px;font-size:21px;font-weight:600;}
.auth-card p.sub{margin:0 0 16px;font-size:13.5px;color:var(--muted);}
.auth-switch{margin-top:16px;text-align:center;font-size:13px;color:var(--muted);}
.auth-switch button{background:none;border:none;color:var(--teal-2);font-weight:600;cursor:pointer;text-decoration:underline;font-family:inherit;padding:0;font-size:13px;}
.auth-note{font-size:12px;color:var(--muted);margin-top:6px;min-height:14px;}

@media (prefers-color-scheme: dark){
  body{background:#0e1210;}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="frame">

  <div id="authOverlay">
    <div class="auth-card">
      <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
        <div class="pillrow light" id="authLangSwitch">
          <button data-lang="sv">SV</button>
          <button data-lang="en">EN</button>
          <button data-lang="ar">AR</button>
        </div>
      </div>
      <h2 id="authTitle"></h2>
      <p class="sub" id="authSubtitle"></p>

      <div id="authNameWrap">
        <label id="authNameLabel"></label>
        <input type="text" id="authNameInput">
      </div>

      <label id="authPhoneLabel"></label>
      <input type="text" id="authPhoneInput">

      <label id="authPassLabel"></label>
      <input type="password" id="authPassInput">

      <div id="authRoleWrap">
        <label id="authRoleLabel"></label>
        <div class="chip-row" id="authRoleChips"></div>
      </div>

      <div id="authProfileWrap" style="display:none;">
        <label id="authProfileLabel"></label>
        <div class="chip-row" id="authProfileChips"></div>
      </div>

      <div style="margin-top:18px;">
        <button class="primary" id="authSubmitBtn" onclick="submitAuth()"></button>
      </div>
      <p class="auth-note" id="authNote"></p>
      <div class="auth-switch">
        <span id="authSwitchText"></span> <button onclick="toggleAuthMode()" id="authSwitchBtn"></button>
      </div>
    </div>
  </div>

  <header class="topbar">
    <div class="brand-row">
      <div class="brand"><span class="dot"></span><span id="brandText"></span></div>
      <div class="pillrow" id="langSwitch">
        <button data-lang="sv">SV</button>
        <button data-lang="en">EN</button>
        <button data-lang="ar">AR</button>
      </div>
    </div>
    <div class="user-row" id="userRow">
      <span id="userGreeting"></span>
      <button onclick="logout()" id="logoutBtn"></button>
    </div>
    <h1 id="screenTitle" style="margin-top:10px;"></h1>
  </header>

  <main>

    <!-- HOME -->
    <section class="screen active" data-screen="home">
      <div class="hero">
        <h2 id="heroTitle"></h2>
        <p id="heroText"></p>
        <button class="primary" id="heroBtn" onclick="goTo('new')"></button>
        <div class="stat-row">
          <div><b id="statActive">0</b><span id="statActiveLabel"></span></div>
          <div><b id="statDone">0</b><span id="statDoneLabel"></span></div>
        </div>
      </div>
      <p class="section-title" id="recentTitle"></p>
      <div id="homeList"></div>
    </section>

    <!-- NEW REQUEST -->
    <section class="screen" data-screen="new">
      <p class="section-title" id="serviceSelectTitle"></p>
      <div class="chip-row" id="serviceChips"></div>

      <div id="requestDetails" style="display:none;">
        <label id="categoryLabel" style="margin-top:18px;"></label>
        <div class="chip-row" id="catChips"></div>

        <label id="descLabel"></label>
        <textarea id="descInput"></textarea>

        <label id="photoLabel"></label>
        <button type="button" class="secondary" id="photoTriggerBtn" onclick="document.getElementById('photoInput').click()" style="width:100%;"></button>
        <input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none;" onchange="handlePhotoSelect(event)">
        <div id="photoPreviewWrap" style="display:none;margin-top:8px;">
          <img id="photoPreviewImg" style="width:100%;max-height:180px;object-fit:cover;display:block;border:1px solid var(--line);">
          <button type="button" class="secondary" id="removePhotoBtn" onclick="removePhoto()" style="margin-top:8px;"></button>
        </div>

        <label id="sizeLabel"></label>
        <div class="chip-row" id="sizeChips"></div>

        <label id="addrLabel"></label>
        <input type="text" id="addrInput">

        <div id="toAddrWrap" style="display:none;">
          <label id="toAddrLabel"></label>
          <input type="text" id="toAddrInput">
        </div>

        <div class="estimate">
          <div><span id="estimateLabel"></span><br><span style="font-size:11.5px;color:var(--muted)" id="estimateSub"></span></div>
          <div class="num" id="priceEstimate">–</div>
        </div>

        <div class="chip-row" style="margin-top:10px;">
          <div class="chip" id="customPriceChip"></div>
        </div>
        <div id="customPriceWrap" style="display:none;">
          <label id="customPriceLabel"></label>
          <input type="number" min="1" id="customPriceInput">
        </div>

        <div style="margin-top:18px;">
          <button class="primary" id="submitBtn" onclick="submitRequest()"></button>
        </div>
      </div>
    </section>

    <!-- JOBS (courier side) -->
    <section class="screen" data-screen="jobs">
      <p class="section-title" id="openJobsTitle"></p>
      <div id="jobsList"></div>
    </section>

    <!-- MINE -->
    <section class="screen" data-screen="mine">
      <div id="accountEditWrap" style="margin-bottom:18px;">
        <p class="section-title" id="accountEditTitle"></p>
        <label id="accountNameLabel"></label>
        <input type="text" id="accountNameInput">
        <label id="accountPhoneLabel"></label>
        <input type="text" id="accountPhoneInput">
        <div style="margin-top:10px;">
          <button class="secondary" id="accountSaveBtn" onclick="saveAccountDetails()"></button>
        </div>
      </div>
      <div id="profileEditWrap" style="display:none;margin-bottom:18px;">
        <p class="section-title" id="profileEditTitle"></p>
        <div class="chip-row" id="profileEditChips"></div>
        <div style="margin-top:10px;">
          <button class="secondary" id="profileSaveBtn" onclick="saveProfile()"></button>
        </div>
      </div>
      <p class="section-title" id="allMineTitle"></p>
      <div id="mineList"></div>
    </section>

    <!-- HISTORY -->
    <section class="screen" data-screen="history">
      <p class="section-title" id="historyTitle"></p>
      <div id="historyList"></div>
    </section>

    <!-- ADMIN -->
    <section class="screen" data-screen="admin">
      <div id="adminHead"></div>
      <input type="text" id="adminSearch" oninput="adminQuery=this.value;renderAdminList()" style="margin-bottom:12px;">
      <div id="adminList"></div>
    </section>
    <section class="screen" data-screen="adminUsers">
      <div id="adminUsersList"></div>
    </section>

  </main>

  <nav class="tabbar">
    <button data-tab="home" onclick="goTo('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span data-tabkey="home"></span>
    </button>
    <button data-tab="new" onclick="goTo('new')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      <span data-tabkey="new"></span>
    </button>
    <button data-tab="jobs" onclick="goTo('jobs')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M6 7V4h12v3M5 7l1 13h12l1-13"/></svg>
      <span data-tabkey="jobs"></span>
    </button>
    <button data-tab="mine" onclick="goTo('mine')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.5-4 5-5.5 7-5.5S17.5 16 19 20"/></svg>
      <span data-tabkey="mine"></span>
      <span class="tab-badge" id="mineBadge"></span>
    </button>
    <button data-tab="history" onclick="goTo('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></svg>
      <span data-tabkey="history"></span>
      <span class="tab-badge" id="historyBadge"></span>
    </button>
    <button data-tab="admin" onclick="goTo('admin')" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>
      <span data-tabkey="admin"></span>
      <span class="tab-badge" id="adminBadge"></span>
    </button>
    <button data-tab="adminUsers" onclick="goTo('adminUsers')" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20c1-4 4-5 6-5s5 1 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2 0 3.5 1.5 4 5"/></svg>
      <span data-tabkey="adminUsers"></span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script>

  moving:{1:60000,2:120000,3:250000},
  goods:{1:10000,2:20000},

  {service:"junk", cat:"furniture", size:2, desc:"أريكة وخزانة، الطابق الثالث بدون مصعد", addr:"الكرادة، بغداد"},

  {service:"goods", cat:"groceries", size:1, desc:"تسوق أسبوعي، يتم إرسال الفاتورة كصورة", addr:"شارع الرشيد، بغداد"},
  {service:"pro", cat:"electrician", size:1, desc:"استبدال مقبسين في غرفة الجلوس", addr:"الكرادة، بغداد"},
  {service:"towing", cat:"breakdown", size:1, desc:"السيارة توقفت فجأة على الطريق السريع", addr:"شارع محمد القاسم، بغداد", toAddr:"المنصور، بغداد"},
  {service:"deliver", cat:"package", size:1, desc:"صندوق صغير يجب تسليمه إلى صديق", addr:"الكرادة، بغداد", toAddr:"زيونة، بغداد"}

const I18N = {
  sv: {
    dir:"ltr",
    brand:"DIZ — skicka vad du behöver",

    authTitleLogin:"Logga in", authTitleRegister:"Skapa konto",
    authSubtitleLogin:"Välkommen tillbaka till Diz", authSubtitleRegister:"Kom igång med Diz",
    authNameLabel:"Namn", authPhoneLabel:"Telefonnummer", authPassLabel:"Lösenord",
    authRoleLabel:"Jag vill registrera mig som:",
    authProfileLabel:"Vilka uppdrag kan du ta emot? (välj en eller flera)",
    profileDriver:"Förare (bud/flytt/varor)",
    profileTowing:"Bärgare (bilbärgning)",
    toastAuthMissingProfiles:"Välj minst en typ av uppdrag",
    profileEditTitle:"Din profil",

const JOBS_CAMEL_TO_SNAKE = {
  desc:'desc_text', toAddr:'to_addr', ownerPhone:'owner_phone', acceptedByPhone:'accepted_by_phone',
  arrivedAt:'arrived_at', markedDoneByProvider:'marked_done_by_provider', markedDoneAt:'marked_done_at',
  paymentReleased:'payment_released', completedAt:'completed_at', createdAt:'created_at',
  problemReported:'problem_reported', problemText:'problem_text', problemReportedAt:'problem_reported_at', autoReleased:'auto_released',
  providerResponse:'provider_response', providerResponseAt:'provider_response_at',
  resolvedAt:'resolved_at'
};
const JOBS_SNAKE_TO_CAMEL = Object.fromEntries(Object.entries(JOBS_CAMEL_TO_SNAKE).map(([c,s])=>[s,c]));

function jobsToRow(camelObj){
  const row = {};
  for(const [k,v] of Object.entries(camelObj)){
    row[JOBS_CAMEL_TO_SNAKE[k] || k] = v;
  }
  return row;
}
function rowToJobObj(row){
  const obj = {};
  for(const [k,v] of Object.entries(row)){
    if(k==='id') continue;
    obj[JOBS_SNAKE_TO_CAMEL[k] || k] = v;
  }
  return obj;
}
function usersObjToRow(camelObj){
  const row = {};
  for(const [k,v] of Object.entries(camelObj)){
    row[k==='createdAt' ? 'created_at' : k] = v;
  }
  return row;
}
function rowToUserObj(row){
  const obj = {};
  for(const [k,v] of Object.entries(row)){
    if(k==='id') continue;
    obj[k==='created_at' ? 'createdAt' : k] = v;
  }
  return obj;
}
function makeSnapshot(id, obj){
  return { id, exists: obj!=null, data: ()=> obj ? {...obj} : undefined };
}

function createSupabaseDbShim(sb){
  const reloaders = new Set();
  const reloadJobs = ()=>reloaders.forEach(f=>f());
  function jobDoc(id){
    return {
      id,
      async get(){
        const { data, error } = await sb.from('jobs').select('*').eq('id', id).maybeSingle();
        if(error) throw error;
        return makeSnapshot(id, data ? rowToJobObj(data) : undefined);
      },
      async set(data){
        const { error } = await sb.from('jobs').upsert({ id, ...jobsToRow(data) });
        if(error) throw error;
        reloadJobs();
      },
      async update(data){
        const { data: rows, error } = await sb.from('jobs').update(jobsToRow(data)).eq('id', id).select('id');
        if(error) throw error;
        if(!rows || rows.length===0) throw new Error('no rows updated (not allowed or not visible)');
        reloadJobs();
      },
      async delete(){
        const { error } = await sb.from('jobs').delete().eq('id', id);
        if(error) throw error;
        reloadJobs();
      }
    };
  }
  function jobsCollection(){
    let whereClauses = [];
    let limitN = null;
    return {
      limit(n){ limitN = n; return this; },
      where(field, op, value){ whereClauses.push([field, op, value]); return this; },
      doc(id){ return jobDoc(id); },
      async add(data){
        const { data: inserted, error } = await sb.from('jobs').insert(jobsToRow(data)).select().single();
        if(error) throw error;
        reloadJobs();
        return jobDoc(inserted.id);
      },
      async get(){
        let q = sb.from('jobs').select('*');
        for(const [field, op, value] of whereClauses){
          const col = JOBS_CAMEL_TO_SNAKE[field] || field;
          q = (op==='!=') ? q.neq(col, value) : q.eq(col, value);
        }
        if(limitN) q = q.limit(limitN);
        const { data, error } = await q;
        if(error) throw error;
        return { empty: data.length===0, docs: data.map(r=>makeSnapshot(r.id, rowToJobObj(r))) };
      },
      onSnapshot(next, errCb){
        // With row-level security a client only receives events for rows it may see, and rows can
        // disappear from view (e.g. a job assigned to someone else). So on any change we simply refetch.
        let alive = true, timer = null;
        async function load(){
          try{
            const { data, error } = await sb.from('jobs').select('*');
            if(error) throw error;
            if(alive) next({ docs: data.map(r=>makeSnapshot(r.id, rowToJobObj(r))) });
          }catch(e){ if(errCb) errCb(e); }
        }
        const schedule = ()=>{ clearTimeout(timer); timer = setTimeout(load, 120); };
        reloaders.add(schedule);
        load();
        const channel = sb.channel('jobs-changes-'+Math.random().toString(36).slice(2))
          .on('postgres_changes', {event:'*', schema:'public', table:'jobs'}, schedule)
          .subscribe();
        const poll = setInterval(load, 30000); // safety net if realtime drops or a row leaves our view
        return ()=>{ alive = false; clearTimeout(timer); clearInterval(poll); reloaders.delete(schedule); sb.removeChannel(channel); };
      }
    };
  }
  function userDoc(key){
    return {
      id:key,
      async get(){
        const { data, error } = await sb.from('users').select('*').eq('id', key).maybeSingle();
        if(error) throw error;
        return makeSnapshot(key, data ? rowToUserObj(data) : undefined);
      },
      async set(data){
        const { error } = await sb.from('users').upsert({ id:key, ...usersObjToRow(data) });
        if(error) throw error;
      },
      async update(data){
        const { error } = await sb.from('users').update(usersObjToRow(data)).eq('id', key);
        if(error) throw error;
      },
      async delete(){
        const { error } = await sb.from('users').delete().eq('id', key);
        if(error) throw error;
      }
    };
  }
  return {
    collection(name){
      if(name==='jobs') return jobsCollection();
      if(name==='users') return {
        async get(){
          // password is deliberately not selected
          const { data, error } = await sb.from('users').select('id,phone,name,role,profiles,created_at');
          if(error) throw error;
          return { empty: data.length===0, docs: data.map(r=>makeSnapshot(r.id, rowToUserObj(r))) };
        }
      };
      throw new Error('unsupported collection: '+name);
    },
    doc(path){
      const slash = path.indexOf('/');
      const coll = path.slice(0, slash), id = path.slice(slash+1);
      if(coll==='jobs') return jobDoc(id);
      if(coll==='users') return userDoc(id);
      throw new Error('unsupported doc path: '+path);
    }
  };
}

let seenSet = new Set();      // event signatures the user has already seen
let shownSigs = new Set();    // flagged events rendered on the current screen
let notifiedSigs = new Set(); // events already toasted in this session
let firstSnapshotDone = false;

function seenKey(){ return 'diz_seen_' + (currentUser ? sanitizePhone(currentUser.phone) : ''); }

  catch(e){ seenSet = new Set(); }
}
function saveSeen(){
  try{ localStorage.setItem(seenKey(), JSON.stringify(Array.from(seenSet).slice(-500))); }catch(e){}
}

// Returns the event this job currently holds for the logged-in user, or null.
function jobEvent(j){
  if(!currentUser) return null;
  const isOwner = j.ownerPhone === currentUser.phone;
  const isAssignee = j.acceptedByPhone === currentUser.phone;
  if(j.status==='cancelled' && ((role==='customer' && isOwner) || (role==='driver' && isAssignee)) && j.completedAt && Date.now()-j.completedAt < 7*86400000){
    return {type:'cancelled', sig:j.id+':cancelled'};
  }
  if(role==='customer' && isOwner){
    if(j.status==='open'){
      const n = Array.isArray(j.applicants) ? j.applicants.length : 0;
      if(n>0) return {type:'applicant', sig:j.id+':app'+n};
    }
    if(j.status==='accepted'){
      if(j.problemReported) return j.providerResponse ? {type:'response', sig:j.id+':resp'} : null;
      if(j.markedDoneByProvider) return {type:'done', sig:j.id+':done'};
      if(j.arrived) return {type:'arrived', sig:j.id+':arrived'};
    }
  }
  if(role==='driver' && isAssignee && j.status==='accepted' && j.problemReported){
    return {type:'problem', sig:j.id+':problem'};
  }
  if(role==='driver' && isAssignee && j.status==='accepted' && !j.arrived && !j.markedDoneByProvider){
    return {type:'assigned', sig:j.id+':assigned'};
  }
  if(role==='driver' && isAssignee && j.status==='done' && j.paymentReleased && j.completedAt && Date.now()-j.completedAt < 7*86400000){
    return {type:'paid', sig:j.id+':paid'};
  }
  return null;
}
function unseenEvents(){
  const out = [];
  jobs.forEach(j=>{ const e = jobEvent(j); if(e && !seenSet.has(e.sig)) out.push(e); });
  return out;
}
function markShownSeen(){
  if(shownSigs.size===0) return;
  shownSigs.forEach(s=>seenSet.add(s));
  shownSigs = new Set();
  saveSeen();
}
function updateBadges(){
  const ev = currentUser ? unseenEvents() : [];
  const n = ev.length;
  const setBadge = (id, count)=>{
    const b = document.getElementById(id);
    if(b){ b.textContent = count>9 ? '9+' : String(count); b.classList.toggle('show', count>0); }
  };
  setBadge('mineBadge', ev.filter(e=>e.type!=='paid' && e.type!=='cancelled').length);
  setBadge('historyBadge', ev.filter(e=>e.type==='paid' || e.type==='cancelled').length);
  setBadge('adminBadge', (role==='admin' && currentUser) ? jobs.filter(j=>adminCat(j)==='problem').length : 0);
  document.title = (n>0 ? '('+n+') ' : '') + 'Diz';
}
function notifyNewEvents(){
  if(!currentUser) return;
  const fresh = unseenEvents().filter(e=>!notifiedSigs.has(e.sig));
  fresh.forEach(e=>notifiedSigs.add(e.sig));
  if(firstSnapshotDone && fresh.length){
    toast('🚩 ' + t().evt[fresh[0].type]);
    try{ if(navigator.vibrate) navigator.vibrate(200); }catch(e){}
  }
}

async function submitAuth(){
  const d = t();
  if(!dbRef || !sbRef){ toast(d.toastDbUnavailable); return; }
  const phone = document.getElementById('authPhoneInput').value.trim();
  const pass = document.getElementById('authPassInput').value;
  const email = authEmail(phone);
  if(authMode === 'register'){
    const name = document.getElementById('authNameInput').value.trim();
    if(!name || !phone || !pass || !email){ toast(d.toastAuthMissingFields); return; }
    if(!authSelectedRole){ toast(d.toastAuthMissingRole); return; }
    if(authSelectedRole==='driver' && authSelectedProfiles.size===0){ toast(d.toastAuthMissingProfiles); return; }
    if(pass.length < 6){ toast(d.toastPasswordShort); return; }
    const profiles = authSelectedRole==='driver' ? Array.from(authSelectedProfiles) : [];
    try{
      const { data, error } = await sbRef.auth.signUp({
        email, password: pass,
        options: { data: { name, phone, role: authSelectedRole, profiles } }
      });
      if(error){
        console.error('signUp failed', error);
        toast(/registered|exists/i.test(error.message) ? d.toastAuthPhoneTaken : (/password/i.test(error.message) ? d.toastPasswordShort : d.toastSaveFailed + ' [' + error.message + ']'));
        return;
      }
      if(!data.session){ toast(d.toastAuthNeedsConfirm); return; }
      if(!(await loadProfile(data.user.id))){ toast(d.toastSaveFailed + ' [profile missing]'); return; }
    }catch(e){ console.error(e); toast(d.toastSaveFailed + ' [' + (e && e.message || e) + ']'); return; }
    toast(d.toastRegisterSuccess);
    enterApp();
  } else {
    if(!phone || !pass || !email){ toast(d.toastAuthMissingFields); return; }
    try{
      const { data, error } = await sbRef.auth.signInWithPassword({ email, password: pass });
      if(error){ toast(d.toastAuthLoginFailed); return; }
      if(!(await loadProfile(data.user.id))){ await sbRef.auth.signOut(); toast(d.toastAuthLoginFailed); return; }

function handlePhotoSelect(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 800;
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale) || 1;
      const h = Math.round(img.height * scale) || 1;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      photoDataUrl = canvas.toDataURL('image/jpeg', 0.6);
      document.getElementById('photoPreviewImg').src = photoDataUrl;
      document.getElementById('photoPreviewWrap').style.display = 'block';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function fmtRemaining(ms){
  if(ms<0) ms = 0;
  const d = Math.floor(ms/86400000), h = Math.floor((ms%86400000)/3600000);
  return t().remainingFmt.replace('{d}', d).replace('{h}', h);
}
// Client-side fallback; the database (pg_cron) does the same on the server.
const autoReleasing = new Set();
async function autoReleaseExpired(){
  if(!dbRef || !currentUser) return;
  const now = Date.now();
  for(const j of jobs){
    if(j.status!=='accepted' || !j.markedDoneByProvider || j.problemReported || !j.markedDoneAt) continue;
    if(now - j.markedDoneAt < REPORT_WINDOW_MS) continue;
    if(j.ownerPhone!==currentUser.phone && j.acceptedByPhone!==currentUser.phone) continue;
    if(autoReleasing.has(j.id)) continue;
    autoReleasing.add(j.id);
    try{ await dbRef.doc('jobs/'+j.id).update({status:'done', paymentReleased:true, autoReleased:true, completedAt:now}); }
    catch(e){ autoReleasing.delete(j.id); }
  }
}
setInterval(autoReleaseExpired, 5*60*1000);

async function submitRequest(){
  const d = t();
  if(!dbRef){ toast(d.toastDbUnavailable); return; }
  const desc = document.getElementById('descInput').value.trim();
  const addr = document.getElementById('addrInput').value.trim();
  const svc = d.services[selectedService];
  const toAddr = svc.needsToAddr ? document.getElementById('toAddrInput').value.trim() : null;
  if(!selectedCat || !selectedSize){ toast(d.toastMissingCatSize); return; }
  if(!desc || !addr || (svc.needsToAddr && !toAddr)){ toast(d.toastMissingFields); return; }
  let price;
  if(useCustomPrice){
    const val = parseInt(document.getElementById('customPriceInput').value, 10);
    if(!val || val<=0){ toast(d.toastInvalidOffer); return; }
    price = val;
  } else {
    price = priceFor(selectedService, selectedSize, selectedCat);
  }
  const wasEditing = !!editingJobId;
  try{
    if(wasEditing){
      await dbRef.doc('jobs/'+editingJobId).update({service:selectedService, cat:selectedCat, desc, addr, toAddr, size:selectedSize, price, photo: photoDataUrl || null});
    } else {
      await dbRef.collection('jobs').add({
        service:selectedService, cat:selectedCat, desc, addr, toAddr, size:selectedSize, price,
        photo: photoDataUrl || null,
        status:"open",
        ownerPhone: currentUser.phone, acceptedByPhone:null, createdAt: Date.now()
      });
    }
  }catch(e){ toast(d.toastSaveFailed); return; }
  resetNewRequestForm();
  toast(wasEditing ? d.toastRequestUpdated : d.toastSubmitted);
  goTo('home');
}

function effectiveStatusKey(j){
  if(j.status==='accepted' && j.problemReported) return 'problem';
  if(j.status==='accepted' && (j.arrived || j.markedDoneByProvider)) return 'arrived';
  return j.status;
}
function statusLabel(j){ return t().status[effectiveStatusKey(j)]; }
function statusClass(j){ return {open:"waiting", accepted:"accepted", arrived:"accepted", problem:"problem", done:"done", cancelled:"done"}[effectiveStatusKey(j)]; }

async function applyToJob(id, price){
  if(!dbRef || !currentUser) return;
  const j = jobs.find(x=>x.id===id);
  if(!j) return;
  const applicants = Array.isArray(j.applicants) ? j.applicants.slice() : [];
  const idx = applicants.findIndex(a=>a.phone===currentUser.phone);
  const entry = {phone: currentUser.phone, name: currentUser.name, price, appliedAt: Date.now()};
  if(idx>=0) applicants[idx] = entry; else applicants.push(entry);
  try{
    await dbRef.doc('jobs/'+id).update({applicants});
    toast(t().toastApplied);
  }catch(e){ toast(t().toastSaveFailed); return; }

  if(!j.ownerPhone){
    setTimeout(async ()=>{
      const jj = jobs.find(x=>x.id===id);
      if(jj && jj.status==='open'){
        try{
          await dbRef.doc('jobs/'+id).update({status:'accepted', acceptedByPhone: currentUser.phone, price});
          toast(t().toastAutoAssignedSim);
        }catch(e){}
      }
    }, 1700);
  }
}

function jobCardHTML(j, courierView){

  if(courierView){

    }
  } else {
    if(j.status==='open' && isMine && role==='customer' && pendingDeleteId!==j.id){
      const applicantsHtml = applicants.length
        ? applicants.slice().sort((a,b)=>a.price-b.price).map(a=>`
          <div class="card" style="margin-bottom:8px;padding:10px 12px;">
            <div class="top-row">
              <div><h3 style="font-size:14px;">${esc(a.name || a.phone)}</h3></div>
              <div class="price" style="font-size:14px;">${a.price} ${d.priceUnit}</div>
            </div>
            <div class="action-row">
              <button class="secondary" onclick="assignJob('${j.id}','${a.phone}')">${d.assignBtn}</button>
            </div>
          </div>`).join('')
        : `<div class="empty" style="padding:14px;">${d.noApplicantsYet}</div>`;
      body = `<span class="status ${statusClass(j)}">${statusLabel(j)}</span>
      <div style="margin-top:10px;">
        <p class="section-title" style="margin-bottom:8px;">${d.applicantsTitle}${applicants.length ? ' (' + applicants.length + ')' : ''}</p>
        ${applicantsHtml}
      </div>
      <div class="action-row">
        <button class="secondary" onclick="editJob('${j.id}')">${d.editBtn}</button>
        <button class="secondary" onclick="askDelete('${j.id}')">${d.deleteBtn}</button>
      </div>`;
    } else if(j.status==='accepted' && isMine && role==='customer'){
      let note = '';
      let btnLabel = d.completeBtn;
      const canComplete = !!(j.arrived || j.markedDoneByProvider);
      const noteStyle = 'margin-top:8px;font-size:13px;';
      const subStyle = 'margin-top:6px;font-size:12.5px;color:var(--muted);';
      if(j.problemReported){
        note = `<div style="${noteStyle}">${d.problemReportedNoteCustomer}</div>
          <div style="${subStyle}">“${esc(j.problemText||'')}”</div>
          ${j.providerResponse ? `<div style="margin-top:8px;font-size:13px;"><b>${d.providerResponseLabel}:</b> “${esc(j.providerResponse)}”</div>` : ''}`;
        btnLabel = d.confirmReleaseBtn;
      } else if(j.markedDoneByProvider){
        const left = fmtRemaining((j.markedDoneAt||Date.now()) + REPORT_WINDOW_MS - Date.now());
        note = `<div style="${noteStyle}">${d.providerMarkedDoneNote}</div>
          <div style="${subStyle}">${d.autoReleaseNote.replace('{time}', left)}</div>`;
        btnLabel = d.confirmReleaseBtn;
      } else if(j.arrived){
        note = `<div style="${noteStyle}">${d.arrivedNoteCustomer}</div>`;
      } else {
        note = `<div style="${noteStyle}color:var(--muted);">${d.waitingProviderArriveNote}</div>`;
      }
      let actions = '';
      if(reportingId===j.id && !j.problemReported){
        actions = `<div style="margin-top:10px;">
          <label style="margin-top:0;">${d.reportProblemPrompt}</label>
          <textarea id="reportInput-${j.id}" oninput="reportDraft=this.value" placeholder="${esc(d.reportProblemPlaceholder)}">${esc(reportDraft)}</textarea>
        </div>
        <div class="action-row">
          <button class="secondary" onclick="submitReport('${j.id}')">${d.sendReportBtn}</button>
          <button class="secondary" onclick="cancelReport()">${d.cancelBtn}</button>
        </div>`;
      } else if(canComplete){
        actions = `<div class="action-row">
          <button class="secondary" onclick="completeJob('${j.id}')">${btnLabel}</button>
          ${j.problemReported ? '' : `<button class="secondary" onclick="startReport('${j.id}')">${d.reportProblemBtn}</button>`}
        </div>`;
      }
      body = `<span class="status ${statusClass(j)}">${statusLabel(j)}</span>
      ${note}
      ${actions}`;
    } else if(j.status==='accepted' && role==='driver' && isMyAcceptedJob){
      let problemNote = '';
      if(j.problemReported){
        problemNote = `<div style="margin-top:6px;font-size:12.5px;color:var(--danger);">${d.problemReportedNoteProvider.replace('{text}', ()=>esc(j.problemText||''))}</div>`;
        if(j.providerResponse){
          problemNote += `<div style="margin-top:8px;font-size:13px;"><b>${d.yourResponseLabel}:</b> “${esc(j.providerResponse)}”</div>`;
        } else {
          problemNote += `<div style="margin-top:10px;">
            <label style="margin-top:0;">${d.respondPrompt}</label>
            <textarea id="respondInput-${j.id}" oninput="respondDrafts['${j.id}']=this.value" placeholder="${esc(d.respondPlaceholder)}">${esc(respondDrafts[j.id]||'')}</textarea>
          </div>
          <div class="action-row">
            <button class="secondary" onclick="submitResponse('${j.id}')">${d.sendResponseBtn}</button>
          </div>`;
        }
      }
      if(j.markedDoneByProvider){
        body = `<span class="status ${statusClass(j)}">${statusLabel(j)}</span>
        ${problemNote}
        <div style="margin-top:6px;font-size:12px;color:var(--muted);">${d.waitingCustomerConfirmNote}</div>`;
      } else if(j.arrived){
        body = `<span class="status ${statusClass(j)}">${statusLabel(j)}</span>
        ${problemNote}
        <div style="margin-top:6px;font-size:12px;color:var(--muted);">${d.arrivedNoteProvider}</div>
        <div class="action-row">
          <button class="secondary" onclick="providerMarkDone('${j.id}')">${d.providerCompleteBtn}</button>
        </div>`;
      } else {
        body = `<span class="status ${statusClass(j)}">${statusLabel(j)}</span>
        <div class="action-row">
          <button class="secondary" onclick="providerArrive('${j.id}')">${d.providerArriveBtn}</button>
        </div>`;
      }
    } else if(j.status==='cancelled'){
      body = `<span class="status ${statusClass(j)}">${statusLabel(j)}</span>
      <div style="margin-top:6px;font-size:12px;color:var(--muted);">${ad().cancelledNote}</div>`;
    } else if(j.status==='done'){
      body = `<span class="status ${statusClass(j)}">${statusLabel(j)}</span>
      <div style="margin-top:6px;font-size:12px;color:var(--muted);">${j.resolution==='released' ? ad().releasedNote : (j.autoReleased ? d.autoReleasedNote : d.paymentReleasedNote)}</div>`;
    } else if(j.status==='open' && isMine && role==='customer' && pendingDeleteId===j.id){
      body = `<span class="status ${statusClass(j)}">${statusLabel(j)}</span>
      <div style="margin-top:8px;font-size:13px;">${d.confirmDeleteInline}</div>
      <div class="action-row">
        <button class="secondary" onclick="confirmDeleteRequest('${j.id}')">${d.confirmDeleteBtn}</button>
        <button class="secondary" onclick="cancelDelete()">${d.cancelBtn}</button>
      </div>`;
    } else {
      body = `<span class="status ${statusClass(j)}">${statusLabel(j)}</span>`;
    }
  }
  const route = j.toAddr ? `${j.addr} → ${j.toAddr}` : j.addr;
  const ev = jobEvent(j);
  let flagHtml = '';
  if(ev && !seenSet.has(ev.sig)){
    shownSigs.add(ev.sig);
    flagHtml = `<div class="flag"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3v18h2v-7h11l-2-4 2-4H7V3z"/></svg>${d.evt[ev.type]}</div>`;
  }
  return `<div class="card route">
    ${flagHtml}
    <div class="top-row">
      <div>
        <div class="service-badge">${serviceLabel(j.service)}</div>
        <h3>${catLabel(j.service, j.cat)}</h3>
        <p class="meta">${esc(j.desc)}</p>
      </div>
      <div class="price">${j.price} ${d.priceUnit}</div>
    </div>
    ${j.photo ? `<img src="${j.photo}" alt="" style="width:100%;max-height:160px;object-fit:cover;margin-top:10px;border:1px solid var(--line);">` : ''}
    <p class="meta" style="margin-top:8px;">${esc(route)}</p>
    ${body}
  </div>`;
}

function renderHome(){
  if(!currentUser) return;
  const all = jobs.filter(j=>j.ownerPhone===currentUser.phone);
  document.getElementById('statActive').textContent = all.filter(r=>!isFinal(r)).length;
  document.getElementById('statDone').textContent = all.filter(r=>r.status==="done").length;
  const mine = all.filter(j=>!isFinal(j));
  const list = document.getElementById('homeList');
  if(mine.length===0){
    list.innerHTML = `<div class="empty">${t().emptyHome}</div>`;
    return;
  }
  list.innerHTML = mine.slice(0,3).map(j=>jobCardHTML(j,false)).join('');
}

function providerCanTake(job){
  if(!currentUser || !currentUser.profiles || currentUser.profiles.length===0) return true;
  const profiles = currentUser.profiles;
  if(profiles.includes('driver') && (job.service==='junk' || job.service==='moving' || job.service==='goods' || job.service==='deliver')) return true;
  if(job.service==='pro' && profiles.includes(job.cat)) return true;
  if(job.service==='towing' && profiles.includes('towing')) return true;
  return false;
}

function renderJobs(){
  const open = jobs.filter(j=>j.status==="open" && providerCanTake(j));
  const taken = jobs.filter(j=>j.status==="accepted" && j.acceptedByPhone===currentUser?.phone);
  const list = document.getElementById('jobsList');
  let html = "";
  if(open.length===0){
    html += `<div class="empty">${t().emptyJobs}</div>`;
  } else {
    html += open.map(j=>jobCardHTML(j,true)).join('');
  }
  if(taken.length){
    html += `<p class="section-title" style="margin-top:18px;">${t().takenTitle}</p>` + taken.map(j=>jobCardHTML(j,false)).join('');
  }
  list.innerHTML = html;
}

function renderMine(){

  renderAccountEdit();

  if(mine.length===0){
    list.innerHTML = `<div class="empty">${t().emptyMineCustomer}</div>`;
    return;
  }
  list.innerHTML = mine.map(j=>jobCardHTML(j,false)).join('');
}

function renderHistory(){
  if(!currentUser) return;
  const list = document.getElementById('historyList');
  document.getElementById('historyTitle').textContent = t().historyTitle;
  if(role==='driver'){
    const done = jobs.filter(j=>j.acceptedByPhone===currentUser.phone && isFinal(j));
    if(done.length===0){
      list.innerHTML = `<div class="empty">${t().emptyHistoryDriver}</div>`;
      return;
    }
    list.innerHTML = done.slice().sort((a,b)=>(b.completedAt||0)-(a.completedAt||0)).map(j=>jobCardHTML(j,false)).join('');
    return;
  }

  if(done.length===0){
    list.innerHTML = `<div class="empty">${t().emptyHistoryCustomer}</div>`;
    return;
  }

let adminFilter = 'all', adminQuery = '', adminUsersList = [], adminNotes = {};
let adminNoteDrafts = {}, adminPending = null, adminPendingUser = null;

function adminCat(j){
  if(j.status==='open') return 'open';
  if(j.status==='accepted') return j.problemReported ? 'problem' : 'active';
  return j.status; // done | cancelled
}
function fmtTime(ts){
  if(!ts) return ad().none;
  try{ return new Date(ts).toLocaleString({sv:'sv-SE', en:'en-GB', ar:'ar-IQ'}[lang]); }catch(e){ return String(ts); }
}
function userByPhone(phone){ return adminUsersList.find(u=>u.phone===phone); }
function userLabel(phone){
  if(!phone) return ad().none;
  const u = userByPhone(phone);
  return u ? `${esc(u.name)} · ${esc(phone)}` : esc(phone);
}

async function loadAdminData(){
  if(!dbRef || !sbRef || role!=='admin') return;
  try{
    const snap = await dbRef.collection('users').get();
    adminUsersList = snap.docs.map(d=>({id:d.id, ...d.data()}));
  }catch(e){ console.error('load users failed', e); }
  try{
    const { data, error } = await sbRef.from('admin_notes').select('job_id,note');
    if(error) throw error;
    adminNotes = Object.fromEntries(data.map(r=>[r.job_id, r.note]));
  }catch(e){ console.error('load notes failed', e); }
  if(role==='admin') refreshCurrentScreen();
}

function setAdminFilter(f){ adminFilter = f; renderAdmin(); }

function renderAdmin(){
  if(role!=='admin') return;
  const a = ad(), d = t();
  const cnt = {open:0, active:0, problem:0, done:0, cancelled:0};
  let escrow = 0, released = 0;
  jobs.forEach(j=>{
    const c = adminCat(j); if(cnt[c]!==undefined) cnt[c]++;
    if(j.status==='accepted') escrow += j.price||0;
    if(j.status==='done' && j.paymentReleased) released += j.price||0;
  });
  const money = n=>`${n.toLocaleString(lang==='ar'?'ar-IQ':lang)} ${d.priceUnit}`;
  const tile = (label, val, warn)=>`<div class="adm-tile${warn?' warn':''}"><b>${val}</b><span>${label}</span></div>`;
  document.getElementById('adminHead').innerHTML =
    `<div class="adm-stats">
      ${tile(a.tiles.total, jobs.length)}
      ${tile(a.tiles.open, cnt.open)}
      ${tile(a.tiles.active, cnt.active)}
      ${tile(a.tiles.problem, cnt.problem, cnt.problem>0)}
      ${tile(a.tiles.done, cnt.done)}
      ${tile(a.tiles.cancelled, cnt.cancelled)}

function renderAdminList(){
  if(role!=='admin') return;
  const a = ad();
  const q = adminQuery.trim().toLowerCase();
  let list = jobs.filter(j=>adminFilter==='all' || adminCat(j)===adminFilter);
  if(q){
    list = list.filter(j=>{
      const ow = userByPhone(j.ownerPhone), pr = userByPhone(j.acceptedByPhone);
      return [j.id, j.desc, j.addr, j.toAddr, j.ownerPhone, j.acceptedByPhone, ow&&ow.name, pr&&pr.name, serviceLabel(j.service), catLabel(j.service, j.cat)]
        .filter(Boolean).join(' ').toLowerCase().includes(q);
    });
  }
  list = list.slice().sort((x,y)=>{
    const px = adminCat(x)==='problem' ? 0 : 1, py = adminCat(y)==='problem' ? 0 : 1;
    return px-py || (y.createdAt||0)-(x.createdAt||0);
  });
  document.getElementById('adminList').innerHTML = list.length
    ? list.map(adminJobCardHTML).join('')
    : `<div class="empty">${a.noJobs}</div>`;
}

  const appl = applicants.length ? applicants.map(x=>`${esc(x.name)} (${x.price})`).join(', ') : a.none;

  const confirmBox = pend ? `<div class="adm-confirm">${a.confirm[pend]}
      <div class="action-row">
        <button class="${pend==='delete'?'danger':'secondary'}" onclick="adminDo('${j.id}','${pend}')">${a.yes}</button>
        <button class="secondary" onclick="adminAbort()">${a.no}</button>
      </div></div>` : `<div class="action-row">${actions}</div>`;

  return `<div class="card route">
    <div class="top-row">
      <div>
        <div class="service-badge">${serviceLabel(j.service)}</div>
        <h3>${catLabel(j.service, j.cat)}</h3>
        <p class="meta">${esc(j.desc)}</p>
      </div>
      <div class="price">${j.price} ${d.priceUnit}</div>
    </div>
    <span class="status ${statusClass(j)}" style="margin-top:8px;display:inline-block;">${statusLabel(j)}</span>
    ${j.photo ? `<img src="${j.photo}" alt="" style="width:100%;max-height:140px;object-fit:cover;margin-top:10px;border:1px solid var(--line);">` : ''}
    <div style="margin-top:8px;">
      ${row(a.id, esc(j.id))}
      ${row('📍', esc(route))}
      ${row(a.customer, userLabel(j.ownerPhone))}
      ${row(a.provider, userLabel(j.acceptedByPhone))}
      ${row(a.applicants, appl)}
      ${row(a.created, fmtTime(j.createdAt))}
      ${j.arrivedAt ? row(a.arrived, fmtTime(j.arrivedAt)) : ''}
      ${j.markedDoneAt ? row(a.markedDone, fmtTime(j.markedDoneAt)) : ''}
      ${j.completedAt ? row(a.completed, fmtTime(j.completedAt)) : ''}
      ${j.resolution ? row(a.resolution, esc(a.res[j.resolution]||j.resolution) + (j.resolvedAt ? ' · '+fmtTime(j.resolvedAt) : '')) : ''}
    </div>
    ${problemBox}
    <div style="margin-top:10px;font-size:12px;color:var(--muted);">${a.noteLabel}</div>
    <textarea id="admNote-${j.id}" placeholder="${a.notePh}" oninput="adminNoteDrafts['${j.id}']=this.value">${esc(draft)}</textarea>
    <div class="action-row"><button class="secondary" onclick="saveAdminNote('${j.id}')">${a.saveNote}</button></div>
    ${confirmBox}
  </div>`;
}

function adminAsk(id, type){ adminPending = {id, type}; renderAdminList(); }
function adminAbort(){ adminPending = null; renderAdminList(); }

async function saveAdminNote(id){
  if(!sbRef || role!=='admin') return;
  const text = (adminNoteDrafts[id]!==undefined ? adminNoteDrafts[id] : (adminNotes[id]||'')).trim();
  try{
    if(text){
      const { error } = await sbRef.from('admin_notes').upsert({job_id:id, note:text, updated_at:Date.now()});
      if(error) throw error;
      adminNotes[id] = text;
    } else {
      const { error } = await sbRef.from('admin_notes').delete().eq('job_id', id);
      if(error) throw error;
      delete adminNotes[id];
    }
    delete adminNoteDrafts[id];
    toast(ad().noteSaved);
  }catch(e){ toast(t().toastSaveFailed); }
}

async function adminDo(id, type){
  if(!dbRef || role!=='admin') return;
  const now = Date.now();
  const ref = dbRef.doc('jobs/'+id);
  let upd = null;
  if(type==='release') upd = {status:'done', paymentReleased:true, completedAt:now, resolution:'released', resolvedAt:now};
  else if(type==='refund') upd = {status:'cancelled', paymentReleased:false, completedAt:now, resolution:'refunded', resolvedAt:now};
  else if(type==='cancel') upd = {status:'cancelled', paymentReleased:false, completedAt:now, resolution:'cancelled', resolvedAt:now};
  else if(type==='reopen') upd = {status:'open', acceptedByPhone:null, arrived:false, arrivedAt:null,
    markedDoneByProvider:false, markedDoneAt:null, paymentReleased:false, completedAt:null,
    problemReported:false, problemText:null, problemReportedAt:null, providerResponse:null, providerResponseAt:null,
    autoReleased:false, resolution:'reopened', resolvedAt:now};
  try{
    if(type==='delete') await ref.delete(); else await ref.update(upd);
    adminPending = null;
    // Make the change visible immediately, even if realtime is slow
    if(type==='delete') jobs = jobs.filter(j=>j.id!==id);
    else jobs = jobs.map(j=>j.id===id ? {...j, ...upd} : j);
    refreshCurrentScreen();
    toast(ad().done);
  }catch(e){ console.error(e); toast(t().toastSaveFailed); }
}

function renderAdminUsers(){
  if(role!=='admin') return;
  const a = ad();
  const el = document.getElementById('adminUsersList');
  if(!adminUsersList.length){ el.innerHTML = `<div class="empty">${a.usersEmpty}</div>`; return; }
  const d = t();
  const roleName = r=> r==='admin' ? a.roleAdmin : (r==='driver' ? d.roleDriver : d.roleCustomer);
  el.innerHTML = adminUsersList.slice().sort((x,y)=>(y.createdAt||0)-(x.createdAt||0)).map(u=>{
    const n = jobs.filter(j=>j.ownerPhone===u.phone || j.acceptedByPhone===u.phone).length;
    const pend = adminPendingUser===u.id;
    const actions = u.role==='admin'
      ? `<div style="margin-top:6px;font-size:12px;color:var(--muted);">${a.adminProtected}</div>`
      : (pend
        ? `<div class="adm-confirm">${a.delUserConfirm}<div class="action-row">
            <button class="danger" onclick="adminDeleteUser('${esc(u.id)}')">${a.yes}</button>
            <button class="secondary" onclick="adminPendingUser=null;renderAdminUsers()">${a.no}</button></div></div>`
        : `<div class="action-row"><button class="danger" onclick="adminPendingUser='${esc(u.id)}';renderAdminUsers()">${a.delUser}</button></div>`);
    return `<div class="card">
      <div class="top-row"><div>
        <div class="service-badge">${roleName(u.role)}</div>
        <h3>${esc(u.name)}</h3>
        <p class="meta">${esc(u.phone)}</p>
      </div><div class="meta" style="font-size:12px;color:var(--muted);">${n} ${a.jobsCount}</div></div>
      <div style="margin-top:6px;font-size:12px;color:var(--muted);">${fmtTime(u.createdAt)}</div>
      ${actions}
    </div>`;
  }).join('');
}

async function adminDeleteUser(id){
  if(!dbRef || role!=='admin') return;
  try{
    const { error } = await sbRef.rpc('admin_delete_user', {uid:id});
    if(error) throw error;
    adminUsersList = adminUsersList.filter(u=>u.id!==id);
    adminPendingUser = null;
    renderAdminUsers();
    toast(ad().userDeleted);
  }catch(e){ toast(t().toastSaveFailed); }
}
/* ---------- END ADMIN PANEL ---------- */

applyStaticText();
boot();
</script>
</body>
</html>
