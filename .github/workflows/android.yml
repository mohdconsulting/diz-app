name: Android
on:
  push:
    branches: [develop-android]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build and test
        run: set -o pipefail; ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest 2>&1 | tee ../build.log
      - name: Publish build log to branch ci-logs
        if: always()
        working-directory: .
        run: |
          mkdir /tmp/logs && cp build.log /tmp/logs/android-build.log || true
          cd /tmp/logs && git init -q && git checkout -q -b ci-logs
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -q -m "android build log ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs
      - uses: actions/upload-artifact@v4
        with:
          name: diz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Signed release bundle (AAB)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "No signing key configured - skipping AAB"; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/diz-upload.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/diz-upload.jks"
          ./gradlew --no-daemon :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: diz-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
