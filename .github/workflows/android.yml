name: Android
on:
  push:
    branches: [develop-android]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build and test
        run: set -o pipefail; ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest 2>&1 | tee ../build.log
      - name: Publish build log to branch ci-logs
        if: always()
        working-directory: .
        run: |
          mkdir /tmp/logs && cp build.log /tmp/logs/android-build.log || true
          cd /tmp/logs && git init -q && git checkout -q -b ci-logs
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -q -m "android build log ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs
      - uses: actions/upload-artifact@v4
        with:
          name: diz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
